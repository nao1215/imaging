# generated by octocov init
coverage:
  if: true
  # The package is at 99.7%. A pull request may not lower it, and the total
  # may not fall below 99%: an uncovered statement is one no test can catch a
  # mutant in either.
  acceptable: current >= 99% && diff >= 0%
  badge:
    path: docs/coverage.svg
testExecutionTime:
  if: true
  badge:
    path: docs/time.svg
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
codeToTestRatio:
  badge:
    path: docs/ratio.svg
