name: MultiVersionUnitTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor go.mod declares and the newest release. The floor moved to
        # 1.25 because golang.org/x/image 0.41.0, the first release carrying the
        # tiff decoder security fixes this library needs, requires it. "stable"
        # tracks each Go release without an edit, and is used rather than "1"
        # because setup-go resolves "1" from its own manifest, which lags a
        # fresh release.
        go-version: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: MultiVersionUnitTest
        run: make test

  cross-build:
    name: Cross build (${{ matrix.goos }})

    # The three test workflows run on the operating systems GitHub hosts
    # runners for. This is the other half, and the cheap one: whether the two
    # modules compile for the BSDs at all. They do today. A library is reached
    # by `go get` from whatever machine the caller has, so a build that stops
    # working there fails in their terminal rather than here unless something
    # watches it. No binary is produced and a leg takes seconds.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, openbsd, netbsd]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Build the library
        run: go build ./...

      - name: Build gina
        run: go build ./...
        working-directory: cmd/gina
